<!DOCTYPE html>

<style>

 background:radial-gradient(ellipse 55% 65% at 50% 45%,#fffefa 0%,#fff3e4 45%,#ffdcd2 85%,#ffcfd6 100%)}
#cam{position:absolute;inset:0;transform-origin:50% 48%}
canvas{position:absolute;inset:0}
svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.ch{fill:var(--ink);fill-opacity:0;stroke:var(--coral);stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:6000 100000;stroke-dashoffset:6100;
 filter:drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(1.2px 1.6px 0 #16204e) drop-shadow(0 6px 14px rgba(238,108,77,.28))}

@keyframes draw{to{stroke-dashoffset:0}}

  draw calc(var(--d) * 2.3) cubic-bezier(.4,0,.6,1) var(--t) both,
  fillin 1.2s ease calc(var(--t) + var(--d) * .55) both,
  rise calc(var(--d) + .5s) cubic-bezier(.2,.7,.2,1) var(--t) both}

.msg{position:absolute;left:0;right:0;text-align:center;color:var(--ink);font:600 34px "Shippori Mincho","Yu Mincho",serif;letter-spacing:.25em}

.ed{position:absolute;left:660px;top:0;width:660px;height:880px;border-radius:0 6px 6px 0;pointer-events:none}

 background:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.09) 0 2px,transparent 2px 5px),linear-gradient(135deg,#2e3f8c,#16204e);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),inset 30px 0 40px -20px rgba(0,0,0,.5)}

#mbox{position:relative;width:100%;height:100%;background:linear-gradient(135deg,#ffd3c4,#cfe4ff)}

#mph button{font-size:28px;padding:12px 34px}
#pick,#exp{position:absolute;right:56px}#pick{top:176px}#exp{top:240px}
.rec #hud{display:none}

#toast.on{opacity:1}
#album.fast .leaf:not(.cv){transition-duration:.55s}
@media (prefers-reduced-motion:reduce){.play #cam{animation:none}}
</style>

<body>
<div id="fit"><div id="stage">
 <div id="fade" style="position:absolute;inset:0">
  <div id="cam">
   <canvas id="dust" width="1920" height="1080"></canvas>
   <svg viewBox="0 0 1920 1080">
    <circle class="ring" cx="960" cy="540" r="525" transform="rotate(-100 960 540)"/>
    <g id="g"></g>
   </svg>
  </div>
 </div>
 <div id="album"><div id="fl"><div id="cam2"><div id="book"><div id="shadow"></div><div id="baser"></div></div></div></div></div>
 <div id="flash"></div>
 <div id="movie"><div id="mframe"><div id="mbox"><div id="mph">ここにメインmovieが流れます<small>写真は、アルバムの中に後から追加できます</small><div><button id="mpick">動画を選ぶ</button><button id="mback">アルバムに戻る</button></div></div></div></div></div>
 <div id="toast"></div>
 <div id="hud"><div id="ttl">桐榮祭 2026</div><button id="again">はじめから</button><button id="bulk">写真をまとめて入れる</button><button id="pick">main movieを選ぶ</button><button id="exp">mp4に書き出す</button><button class="nb" id="prev" aria-label="前へ">‹</button><button class="nb" id="next" aria-label="次へ">›</button><div id="tip">写真をタップして追加できます</div><div id="cnt"></div></div>
 <input type="file" id="file" accept="image/*" hidden><input type="file" id="files" accept="image/*" multiple hidden><input type="file" id="mfile" accept="video/*" hidden>
 <div id="hint" class="msg"></div>
 <div id="start" class="msg">タップして再生<small>♪ 音が出ます</small></div>
</div></div>
<script>
const NS="http://www.w3.org/2000/svg",stage=document.getElementById("stage"),fit=document.getElementById("fit"),
      g=document.getElementById("g"),hint=document.getElementById("hint"),startEl=document.getElementById("start");
function resize(){
  const s=Math.min(innerWidth/1920,innerHeight/1080);
  fit.style.left=(innerWidth-1920*s)/2+"px"; fit.style.top=(innerHeight-1080*s)/2+"px";
  fit.style.transform=`scale(${s})`;
}
addEventListener("resize",resize);resize();

/* ---------- 文字 ---------- */
let SCHED=[];
function line(text,o){
  const items=[...text].map(c=>{
    const e=document.createElementNS(NS,"text");
    e.textContent=c;e.setAttribute("font-size",o.size);e.setAttribute("class","ch "+o.cls);e.setAttribute("stroke-width",o.sw);
    g.appendChild(e);
    return {e,c,w:c===" "?o.size*.3:e.getComputedTextLength()};
  });
  const total=items.reduce((a,b)=>a+b.w,0)+o.track*(items.length-1);
  let x=960-total/2;
  items.forEach((it,i)=>{
    if(it.c===" "){it.e.remove()}else{
      const t=o.t0+i*o.step;
      it.e.setAttribute("x",x);it.e.setAttribute("y",o.y+(o.jit?(Math.random()-.5)*o.jit:0));
      it.e.style.setProperty("--t",t+"s");it.e.style.setProperty("--d",o.dur+"s");
      SCHED.push({k:"s",t,d:o.dur*.9},{k:"n",t:t+o.dur*.9,oct:o.oct,i});
    }
    x+=it.w+o.track;
  });
}
function rule(x,y,w,t,d){
  const r=document.createElementNS(NS,"rect");
  r.setAttribute("class","rule");r.setAttribute("x",x-w/2);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",3);
  r.style.setProperty("--t",t+"s");r.style.setProperty("--d",d+"s");g.appendChild(r);
  SCHED.push({k:"w",t,d});
}
function build(){
  g.innerHTML="";SCHED=[];
  line("桐榮祭",{cls:"jp",size:300,y:650,t0:1.2,step:.9,dur:2.0,sw:2.5,track:50,oct:.5});
  rule(960,725,860,4.4,1.6);
  line("2026",{cls:"en",size:96,y:310,t0:5.2,step:.3,dur:1.0,sw:1.6,track:44,jit:6,oct:1});
  rule(640,270,200,5.0,1.2);rule(1280,270,200,5.0,1.2);
  line("The Memories",{cls:"en",size:120,y:880,t0:6.4,step:.28,dur:1.0,sw:1.6,track:6,jit:8,oct:1});
}

/* ---------- 色とりどりの光 ---------- */
const cv=document.getElementById("dust"),cx=cv.getContext("2d");
const COL=[[255,150,120],[255,165,200],[140,195,255],[255,205,110],[190,170,255]];
let P=[],T0=0;
function seed(){
  P=Array.from({length:60},()=>({x:Math.random()*1920,y:Math.random()*1200,r:6+Math.random()*Math.random()*46,
    v:10+Math.random()*28,a:.18+Math.random()*.4,ph:Math.random()*6.28,c:COL[Math.floor(Math.random()*COL.length)]}));
}
function tick(now){
  const t=(now-T0)/1000;cx.clearRect(0,0,1920,1080);
  const env=Math.min(1,t/1.5)*(t>14.1?Math.max(0,1-(t-14.1)/.9):1);
  for(const p of P){
    const y=((p.y-p.v*t)%1200+1200)%1200-60,x=p.x+Math.sin(t*.4+p.ph)*30;
    const a=p.a*env*(.65+.35*Math.sin(t*1.2+p.ph)),[r,gg,b]=p.c;
    const gr=cx.createRadialGradient(x,y,0,x,y,p.r);
    gr.addColorStop(0,`rgba(${r},${gg},${b},${a})`);gr.addColorStop(.7,`rgba(${r},${gg},${b},${a*.5})`);gr.addColorStop(1,`rgba(${r},${gg},${b},0)`);
    cx.fillStyle=gr;cx.beginPath();cx.arc(x,y,p.r,0,6.283);cx.fill();
  }
  if(t<16)requestAnimationFrame(tick);
}

/* ---------- 音 (Web Audio で合成) ---------- */
let AC,master,bus,NB;
const SCALE=[523.25,587.33,659.25,783.99,880,1046.5];
function audioInit(ctx){
  if(AC&&!ctx)return;
  AC=ctx||new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();const cp=AC.createDynamicsCompressor();cp.threshold.value=-20;cp.ratio.value=3;master.connect(cp);cp.connect(AC.destination);window.CP=cp;
  bus=AC.createGain();bus.connect(master);
  const len=AC.sampleRate*3.4,ib=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.0);}
  const cv2=AC.createConvolver();cv2.buffer=ib;const vg=AC.createGain();vg.gain.value=.55;
  bus.connect(cv2);cv2.connect(vg);vg.connect(master);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
function tone(f,t,dur,vol){
  const o=AC.createOscillator(),gn=AC.createGain();o.frequency.value=f;
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn);gn.connect(bus);o.start(t);o.stop(t+dur+.05);
}
function bell(f,t,v){tone(f,t,2.4,v);tone(f*2.01,t,1.3,v*.35);tone(f*3.99,t,.6,v*.12);}
function pad(notes,t,dur){
  notes.forEach(f=>[-5,5].forEach(dt=>{
    const o=AC.createOscillator(),lp=AC.createBiquadFilter(),gn=AC.createGain();
    o.type="triangle";o.frequency.value=f;o.detune.value=dt;lp.type="lowpass";lp.frequency.value=1500;
    gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.03,t+1.2);gn.gain.linearRampToValueAtTime(0,t+dur+1.2);
    o.connect(lp);lp.connect(gn);gn.connect(bus);o.start(t);o.stop(t+dur+1.3);
  }));
}
function noise(t,d,type,f0,f1,vol,bumps){
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const fl=AC.createBiquadFilter();fl.type=type;fl.Q.value=1.3;
  fl.frequency.setValueAtTime(f0,t);fl.frequency.linearRampToValueAtTime(f1,t+d);
  const gn=AC.createGain(),c=new Float32Array(bumps);
  for(let i=1;i<bumps-1;i++)c[i]=vol*(.5+Math.random()*.7);
  gn.gain.setValueCurveAtTime(c,t,d);
  s.connect(fl);fl.connect(gn);gn.connect(bus);s.start(t);s.stop(t+d);
}
function schedAudio(){
  const t=AC.currentTime+.2;
  master.gain.cancelScheduledValues(0);master.gain.setValueAtTime(0,t);
  master.gain.linearRampToValueAtTime(.9,t+1.5);master.gain.setValueAtTime(.9,t+14.1);master.gain.linearRampToValueAtTime(0,t+15);
